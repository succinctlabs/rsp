services:
  rsp:
    build:
      context: ../..
      target: rsp-ethproofs
    env_file: .env
    # SP1's JIT native executor (the validation execute) allocates guest memory and trace
    # rings as POSIX shared memory (`shm_open`), i.e. files in /dev/shm. Docker's default
    # 64MB /dev/shm makes those writes SIGBUS (signal 7) on mainnet blocks; raise the cap.
    # tmpfs is allocated lazily, so this reserves no RAM up front.
    shm_size: 16gb
    # Publish the internal Prometheus metrics endpoint (must match METRICS_ADDR in .env).
    ports:
      - "9000:9000"
    # Proving runs in-process on the GPU (managed by the SP1 SDK), so the service needs GPU access.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
